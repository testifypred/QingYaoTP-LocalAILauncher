name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  sanity:
    name: 语法 / 版本 / 仓库卫生
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 所有 .mjs / .cjs 语法检查
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path server -Recurse -File |
            Where-Object { $_.Extension -in '.mjs', '.cjs' -and $_.FullName -notlike '*\node_modules\*' }
          $bad = @()
          foreach ($f in $files) {
            node --check $f.FullName
            if ($LASTEXITCODE -ne 0) { $bad += $f.FullName }
          }
          if ($bad.Count -gt 0) { throw ("JS 语法错误： " + ($bad -join ', ')) }
          Write-Host "OK: $($files.Count) 个 JS 文件语法通过"

      - name: 版本号一致（app.mjs / package.json / localai.mjs）
        shell: pwsh
        run: |
          $app = (Select-String -Path server/app.mjs -Pattern 'const APP_VERSION = "([^"]+)"').Matches.Groups[1].Value
          $pkg = (Select-String -Path server/package.json -Pattern '"version":\s*"([^"]+)"').Matches.Groups[1].Value
          $cli = (Select-String -Path server/localai.mjs -Pattern 'const VERSION = "([^"]+)"').Matches.Groups[1].Value
          Write-Host "app.mjs=$app  package.json=$pkg  localai.mjs=$cli"
          if ([string]::IsNullOrWhiteSpace($app) -or $app -ne $pkg -or $app -ne $cli) {
            throw "版本号不一致：app.mjs=$app package.json=$pkg localai.mjs=$cli"
          }

      - name: 许可证文件（LICENSE / NOTICE / THIRD_PARTY_NOTICES + package.json license）
        shell: pwsh
        run: |
          foreach ($f in @('LICENSE', 'NOTICE', 'THIRD_PARTY_NOTICES.md')) {
            if (-not (Test-Path $f)) { throw ("missing " + $f) }
          }
          $pkg = Get-Content server/package.json -Raw | ConvertFrom-Json
          if ($pkg.license -ne 'Apache-2.0') { throw ("server/package.json license must be Apache-2.0, got " + $pkg.license) }
          $lic = Get-Content LICENSE -Raw
          if ($lic -notmatch 'Apache License') { throw "LICENSE does not contain Apache License text" }
          Write-Host "OK: LICENSE / NOTICE / THIRD_PARTY_NOTICES present; package.json license=Apache-2.0"

      # 注意：shell: powershell 的步骤脚本是 UTF-8 无 BOM，PS 5.1 会按 ANSI 解码，
      # 所以本步骤里绝不能出现中文（否则报 "Unexpected token" / 字符串未闭合）。
      - name: PowerShell 5.1 syntax check (build scripts)
        shell: powershell
        run: |
          $files = @()
          $files += Get-ChildItem -Path server -Filter *.ps1 -File
          $files += Get-Item server/docs/run-full.ps1
          $bad = 0
          foreach ($f in $files) {
            $errs = $null
            $tok = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tok, [ref]$errs) | Out-Null
            if ($errs.Count -gt 0) {
              Write-Host ("FAIL " + $f.FullName)
              $errs | ForEach-Object { Write-Host ("  " + $_.Message) }
              $bad++
            }
          }
          if ($bad -gt 0) { throw ($bad.ToString() + " .ps1 file(s) have syntax errors") }
          Write-Host ("OK: " + $files.Count + " .ps1 parsed by Windows PowerShell 5.1")

      - name: 仓库卫生（模型 / 发布包 / 运行数据不入库）
        shell: pwsh
        run: |
          $tracked = git ls-files
          $bad = @()
          foreach ($p in @('data/', 'logs/', 'workspace/', 'dist/', 'node_modules/', 'tools/', 'mmproj/')) {
            if ($tracked | Where-Object { $_ -like "$p*" }) { $bad += $p }
          }
          if ($tracked | Where-Object { $_ -like '*.gguf' -or $_ -like '*.part' }) { $bad += 'gguf/part' }
          if ($bad.Count -gt 0) { throw ("不该入库的东西： " + ($bad -join ', ')) }
          Write-Host "OK: 模型 / 发布包 / 运行数据都没有入库（$($tracked.Count) 个文件）"

      - name: README（首启弹窗与 GitHub 首页同源）
        shell: pwsh
        run: |
          if (-not (Test-Path README.md)) { throw "缺少 README.md" }
          $len = (Get-Content README.md -Raw).Length
          if ($len -lt 1000) { throw "README.md 太短（$len 字符）" }
          Write-Host "OK: README.md $len 字符"
