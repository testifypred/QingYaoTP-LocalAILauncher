<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Debugging Tool · 本地 AI</title>
<link rel="icon" type="image/x-icon" href="/debug-icon.ico">
<link rel="icon" type="image/png" sizes="64x64" href="/debug-icon.png">
<style>
:root{
  --bg:#07080b;--panel:#0f1218;--panel2:#141922;--line:#242b37;--line2:#323a49;
  --text:#e8edf5;--dim:#8e9aad;--cyan:#22d3ee;--ok:#34d399;--warn:#fbbf24;--err:#f87171;
  --mono:ui-monospace,Consolas,"Cascadia Mono",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.55 "Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:linear-gradient(180deg,#0b0e14,#07080b);z-index:5}
.mark{width:30px;height:30px;border-radius:8px;background:#000;border:1px solid rgba(34,211,238,.35);display:grid;place-items:center;font-family:"Cambria Math",serif;font-style:italic;font-size:19px;position:relative}
.mark i{position:absolute;right:2px;top:-3px;font:700 11px "Segoe UI";color:var(--cyan);font-style:normal}
h1{font-size:15px;margin:0;letter-spacing:.02em}
h1 small{color:var(--dim);font-weight:400;font-size:11.5px;margin-left:8px}
.spacer{flex:1}
button{background:var(--panel2);color:var(--text);border:1px solid var(--line2);border-radius:7px;padding:6px 11px;font-size:12px;cursor:pointer}
button:hover{border-color:var(--cyan);color:var(--cyan)}
button.primary{background:var(--cyan);border-color:var(--cyan);color:#04141a;font-weight:700}
button.danger:hover{border-color:var(--err);color:var(--err)}
.wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;padding:14px 18px 28px}
@media (max-width:1080px){.wrap{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.card h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:0 0 10px;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11.5px;border:1px solid var(--line2)}
.pill.ok{color:var(--ok);border-color:rgba(52,211,153,.45)}
.pill.warn{color:var(--warn);border-color:rgba(251,191,36,.45)}
.pill.err{color:var(--err);border-color:rgba(248,113,113,.5)}
ul.checks{list-style:none;margin:0;padding:0}
ul.checks li{display:flex;gap:9px;padding:7px 0;border-top:1px dashed var(--line)}
ul.checks li:first-child{border-top:0}
.dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 8px rgba(52,211,153,.6)}
.dot.warn{background:var(--warn);box-shadow:0 0 8px rgba(251,191,36,.5)}
.dot.err{background:var(--err);box-shadow:0 0 8px rgba(248,113,113,.6)}
.ct{font-weight:600;font-size:12.5px}
.cd{color:var(--dim);font-size:11.5px;word-break:break-word}
.fix{color:var(--warn);font-size:11.5px;margin-top:3px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;font-size:12px}
.kv b{color:var(--dim);font-weight:500}
.kv span{font-family:var(--mono);word-break:break-all}
pre{background:#05060a;border:1px solid var(--line);border-radius:8px;padding:10px;margin:0;max-height:300px;overflow:auto;font:11.5px/1.5 var(--mono);color:#cbd6e6;white-space:pre-wrap;word-break:break-all}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;gap:4px}
.seg button.sel{background:rgba(34,211,238,.14);border-color:var(--cyan);color:var(--cyan)}
.hint{color:var(--dim);font-size:11.5px}
.err{border-color:rgba(248,113,113,.5)}
/* 实时资源卡 */
.met{margin-bottom:9px}
.metTop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12px;color:var(--dim);margin-bottom:4px}
.metTop b{font-family:var(--mono);color:var(--text);font-size:12.5px;font-weight:600;text-align:right}
.bar{height:7px;border-radius:999px;background:#1b2130;border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#22d3ee,#38bdf8);transition:width .45s ease,background .3s}
.bar i.warn{background:linear-gradient(90deg,#fbbf24,#f59e0b)}
.bar i.err{background:linear-gradient(90deg,#f87171,#ef4444)}
.resNote{color:var(--dim);font-size:11px;font-family:var(--mono);margin-top:4px;word-break:break-word}
#resSpark{display:block;width:100%;height:56px;margin-top:10px;border:1px solid var(--line);border-radius:8px;background:#05060a}
#resCard .kv{margin-top:10px}
</style>
</head>
<body>
<header>
  <div class="mark">∂<i>?</i></div>
  <h1>Debugging Tool<small id="ver">—</small></h1>
  <span class="spacer"></span>
  <span id="pills" class="row"></span>
  <button id="refresh">刷新</button>
  <button id="copy">复制报告</button>
</header>

<div class="wrap">
  <div class="card">
    <h2>检查项 <span class="hint" id="checkedAt"></span></h2>
    <ul class="checks" id="checks"></ul>
  </div>

  <div style="display:grid;gap:14px;align-content:start">
    <div class="card" id="resCard">
      <h2>实时资源 <span class="hint" id="resUpdated">等待采样…</span></h2>
      <div class="met">
        <div class="metTop"><span>CPU 占用</span><b id="resCpu">—</b></div>
        <div class="bar"><i id="resCpuBar" style="width:0%"></i></div>
        <div class="resNote" id="resCpuNote">—</div>
      </div>
      <div class="met">
        <div class="metTop"><span>内存</span><b id="resMem">—</b></div>
        <div class="bar"><i id="resMemBar" style="width:0%"></i></div>
        <div class="resNote" id="resMemNote">—</div>
      </div>
      <div class="kv" id="resKv"></div>
      <canvas id="resSpark" width="560" height="56"></canvas>
      <div class="resNote">最近 60 次采样（约 2 分钟）· 青 = CPU% · 紫 = 内存% · 黄虚线 = 70%</div>
    </div>
    <div class="card">
      <h2>运行环境</h2>
      <div class="kv" id="env"></div>
    </div>
    <div class="card">
      <h2>模型与推理</h2>
      <div class="kv" id="model"></div>
    </div>
    <div class="card">
      <h2>数据与插件</h2>
      <div class="kv" id="data"></div>
    </div>
    <div class="card">
      <h2>日志</h2>
      <div class="row" style="margin-bottom:8px">
        <div class="seg">
          <button id="logApp" class="sel">app.log</button>
          <button id="logCrash">崩溃记录</button>
        </div>
        <span class="spacer"></span>
        <span class="hint" id="logInfo"></span>
        <button id="logRefresh">重读</button>
      </div>
      <pre id="logBox">（读取中…）</pre>
    </div>
    <div class="card">
      <h2>修复动作</h2>
      <div class="row">
        <button id="clearCrash" class="danger">清空崩溃记录（恢复 Vulkan）</button>
        <button id="ragRebuild">重建文档索引</button>
        <button id="unload">卸载模型（释放内存）</button>
      </div>
      <div class="hint" id="actionInfo" style="margin-top:8px">这里的动作都会立刻生效；卸载模型后要重新加载才能问答。</div>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let localToken = '';
let diag = null;
let logWhich = 'app';

const esc = (s) => String(s == null ? '' : s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

async function api(path, opt) {
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({}));
  return { status: r.status, j };
}

function kvRows(el, rows) {
  el.innerHTML = rows.map(([k, v]) => '<b>' + esc(k) + '</b><span>' + esc(v) + '</span>').join('');
}

function fmtGB(n) { return (Number(n) || 0).toFixed(1) + ' GB'; }
function fmtTime(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  if (Number.isNaN(d.getTime())) return '—';
  const p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
function fmtUptime(sec) {
  const s = Number(sec) || 0;
  if (s < 90) return s + ' 秒';
  if (s < 5400) return Math.round(s / 60) + ' 分钟';
  return (s / 3600).toFixed(1) + ' 小时';
}
function fmtMB(n) { return Math.round(Number(n) || 0) + ' MB'; }

// ---------------------------------------------------------------- 实时资源
// 2 秒轮询 /api/diag/resources；CPU 首次采样为 null（服务刚起没有基准），先显示「—」，
// 1 秒后自动补采一次，之后每 2 秒刷新。条形颜色按阈值：>=70% 黄、>=90% 红。
let resLast = null;
const resHist = [];
let resRetry = 0;

function barLevel(pct) { return pct >= 90 ? 'err' : pct >= 70 ? 'warn' : ''; }
function setBar(el, pct) {
  const p = Math.max(0, Math.min(100, Number(pct) || 0));
  el.style.width = p + '%';
  el.className = barLevel(p);
}

function drawSpark() {
  const cv = $('resSpark');
  if (!cv) return;
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(240, Math.round(cv.clientWidth || 560)), h = 56;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
  }
  const ctx = cv.getContext('2d');
  if (!ctx) return;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const top = 4, span = h - 8;
  const yOf = (v) => top + span * (1 - Math.max(0, Math.min(100, v)) / 100);
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(36,43,55,.9)';
  for (const f of [0, 0.5, 1]) {
    const y = Math.round(top + span * f) + 0.5;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }
  const y70 = Math.round(yOf(70)) + 0.5;
  ctx.save();
  ctx.setLineDash([3, 4]);
  ctx.strokeStyle = 'rgba(251,191,36,.35)';
  ctx.beginPath(); ctx.moveTo(0, y70); ctx.lineTo(w, y70); ctx.stroke();
  ctx.restore();
  const n = resHist.length;
  if (!n) return;
  // 不足 60 个点时按全宽铺开（刚打开页面也像折线图）；满 60 点后就是左→右的时间序列
  const slot = (i) => (n <= 1 ? w / 2 : (i / (n - 1)) * w);
  const drawLine = (key, color) => {
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.6;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    let started = false;
    for (let i = 0; i < n; i++) {
      const v = resHist[i][key];
      if (v == null) { started = false; continue; }
      const x = slot(i), y = yOf(v);
      if (started) ctx.lineTo(x, y); else { ctx.moveTo(x, y); started = true; }
    }
    ctx.stroke();
    for (let i = n - 1; i >= 0; i--) {
      const v = resHist[i][key];
      if (v == null) continue;
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(slot(i), yOf(v), 2, 0, Math.PI * 2); ctx.fill();
      break;
    }
  };
  drawLine('mem', '#a78bfa');
  drawLine('cpu', '#22d3ee');
}

function renderRes(r) {
  if (!r) return;
  resLast = r;
  const cpu = r.cpu || {}, mem = r.mem || {}, proc = r.proc || {}, mdl = r.model || {};
  const cpuPct = typeof cpu.usagePct === 'number' ? cpu.usagePct : null;
  $('resCpu').textContent = cpuPct == null ? '—' : cpuPct + '%';
  setBar($('resCpuBar'), cpuPct == null ? 0 : cpuPct);
  $('resCpuNote').textContent = (cpu.cores ? cpu.cores + ' 核 · ' + (cpu.model || '') : '—') + (cpuPct == null ? ' · 首次采样中，1 秒后补上' : '');
  const memPct = Math.max(0, Math.min(100, Number(mem.usedPct) || 0));
  $('resMem').textContent = fmtGB(mem.usedGB) + ' / ' + fmtGB(mem.totalGB) + ' · ' + memPct + '%';
  setBar($('resMemBar'), memPct);
  $('resMemNote').textContent = '空闲 ' + fmtGB(mem.freeGB);
  kvRows($('resKv'), [
    ['进程', 'pid ' + (proc.pid || '—') + ' · RSS ' + fmtMB(proc.rssMB) + ' · heap ' + fmtMB(proc.heapUsedMB) + ' · 外部 ' + fmtMB(proc.externalMB)],
    ['磁盘', r.disk && r.disk.path ? '剩余 ' + fmtGB(r.disk.freeGB) + ' / ' + fmtGB(r.disk.totalGB) + ' · ' + r.disk.path : '—（取不到）'],
    ['模型', (mdl.file || '未加载') + (mdl.context ? ' · ' + mdl.context + ' tok' : '')],
    ['后端', (mdl.gpu === 'vulkan' ? 'Vulkan（核显）' : (mdl.gpu || '—')) + ' · KV 量化 ' + (mdl.kvQuant || '—')],
    ['并发', (mdl.activeChats || 0) + ' 个进行中 · KV 缓存常驻 ' + (mdl.cachedTokens || 0) + ' token'],
    ['崩溃', (r.crash || 0) + ' 条（近 10 分钟）'],
  ]);
  $('resUpdated').textContent = '· ' + fmtTime(r.now) + ' · 每 2 秒刷新';
  resHist.push({ cpu: cpuPct, mem: memPct });
  while (resHist.length > 60) resHist.shift();
  drawSpark();
  if (cpuPct == null && !resRetry) {
    resRetry = setTimeout(() => {
      resRetry = 0;
      if (document.visibilityState === 'visible') loadRes().catch(() => {});
    }, 1100);
  }
}

async function loadRes() {
  const r = await api('/api/diag/resources');
  if (r.status !== 200) {
    $('resUpdated').textContent = '· 接口不可用 HTTP ' + r.status;
    return;
  }
  renderRes(r.j);
}

function render() {
  if (!diag) return;
  const sum = diag.summary || {};
  $('pills').innerHTML =
    '<span class="pill err">错误 ' + (sum.error || 0) + '</span>' +
    '<span class="pill warn">警告 ' + (sum.warn || 0) + '</span>' +
    '<span class="pill ok">正常 ' + (sum.ok || 0) + '</span>';

  $('ver').textContent = 'v' + diag.version.version + (diag.version.commit ? ' · ' + diag.version.commit : '');
  $('checkedAt').textContent = '· ' + fmtTime(diag.now);

  $('checks').innerHTML = (diag.checks || []).map((c) => {
    const lv = c.level === 'error' ? 'err' : c.level;
    return '<li><span class="dot ' + lv + '"></span><div style="min-width:0">' +
      '<div class="ct">' + esc(c.title) + '</div>' +
      '<div class="cd">' + esc(c.detail) + '</div>' +
      (c.fix ? '<div class="fix">→ ' + esc(c.fix) + '</div>' : '') +
      '</div></li>';
  }).join('');

  const s = diag.server || {}, sys = diag.system || {}, m = diag.model || {};
  kvRows($('env'), [
    ['系统', (sys.platform || '') + ' ' + (sys.arch || '') + ' · ' + sys.cpus + ' 核 · 内存 ' + fmtGB(sys.totalGB) + '（可用 ' + fmtGB(sys.freeGB) + '）'],
    ['Node', sys.node],
    ['版本', 'v' + diag.version.version + (diag.version.commit ? ' (' + diag.version.commit + (diag.version.dirty ? ' 未提交' : '') + ')' : diag.version.builtAt ? ' 打包 ' + diag.version.builtAt.slice(0, 16).replace('T', ' ') : '')],
    ['服务', '127.0.0.1:' + s.port + ' · pid ' + s.pid + ' · 已运行 ' + fmtUptime(s.uptimeSec)],
    ['并发', (s.activeChats || 0) + ' 个进行中'],
    ['后端', s.gpu === 'vulkan' ? 'Vulkan（核显）' : 'CPU' + (s.backendNote ? ' · ' + s.backendNote : '')],
    ['目录', (diag.paths || {}).dir || ''],
    ['日志', (diag.paths || {}).logs || ''],
  ]);

  kvRows($('model'), [
    ['已加载', m.file || '未加载'],
    ['上下文', m.context ? m.context + ' tok' : '—'],
    ['层数', m.layers || '—'],
    ['KV 缓存', (m.kvReuse ? '复用开' : '复用关') + ' · 常驻 ' + (m.cachedTokens || 0) + ' token'],
    ['KV 量化', (m.kvQuant || '—') + (m.kvQuantFallback ? '（回退：' + m.kvQuantFallback + '）' : '')],
    ['模型库', (m.count || 0) + ' 个 .gguf'],
  ]);

  kvRows($('data'), [
    ['会话目录', (diag.paths || {}).sessions || ''],
    ['崩溃记录', (diag.paths || {}).crashLog || ''],
  ]);
}

async function loadDiag() {
  const r = await api('/api/diag');
  if (r.status !== 200) {
    $('checks').innerHTML = '<li><span class="dot err"></span><div><div class="ct">诊断接口不可用</div><div class="cd">HTTP ' + r.status + '</div></div></li>';
    return;
  }
  diag = r.j;
  localToken = (await api('/api/state')).j?.localToken || '';
  render();
}

async function loadLog() {
  $('logBox').textContent = '（读取中…）';
  const r = await api('/api/diag/logs?which=' + logWhich + '&lines=300');
  const j = r.j || {};
  if (r.status !== 200) { $('logBox').textContent = '读取失败：HTTP ' + r.status; return; }
  $('logInfo').textContent = (j.file || '') + (j.size ? ' · ' + (j.size / 1024).toFixed(0) + ' KB' : '') + (j.truncated ? ' · 只显示尾部' : '');
  $('logBox').textContent = j.text || (j.error ? '（读不到：' + j.error + '）' : '（空）');
  $('logBox').scrollTop = $('logBox').scrollHeight;
}

function reportText() {
  if (!diag) return '';
  const lines = [];
  lines.push('本地 AI Debugging Tool · v' + diag.version.version + (diag.version.commit ? ' (' + diag.version.commit + ')' : ''));
  lines.push('生成时间: ' + fmtTime(diag.now));
  lines.push('服务: 127.0.0.1:' + diag.server.port + ' · pid ' + diag.server.pid + ' · 后端 ' + diag.server.gpu);
  lines.push('系统: ' + diag.system.platform + ' ' + diag.system.arch + ' · ' + diag.system.cpus + ' 核 · 内存 ' + fmtGB(diag.system.totalGB) + '（可用 ' + fmtGB(diag.system.freeGB) + '） · node ' + diag.system.node);
  if (resLast) {
    const rc = resLast.cpu || {}, rm = resLast.mem || {}, rp = resLast.proc || {}, rd = resLast.disk;
    lines.push('实时资源: CPU ' + (typeof rc.usagePct === 'number' ? rc.usagePct + '%' : '—') +
      ' · 内存 ' + fmtGB(rm.usedGB) + '/' + fmtGB(rm.totalGB) + ' (' + (rm.usedPct || 0) + '%)' +
      ' · 进程 RSS ' + fmtMB(rp.rssMB) +
      ' · 磁盘剩余 ' + (rd && rd.path ? fmtGB(rd.freeGB) : '—'));
  }
  lines.push('模型: ' + (diag.model.file || '未加载') + ' · 上下文 ' + diag.model.context + ' · ' + diag.model.layers + ' 层 · KV ' + diag.model.cachedTokens);
  lines.push('--- 检查 ---');
  for (const c of diag.checks) {
    const tag = c.level === 'error' ? '[错误]' : c.level === 'warn' ? '[警告]' : '[正常]';
    lines.push(tag + ' ' + c.title + ' — ' + c.detail + (c.fix ? ' → ' + c.fix : ''));
  }
  return lines.join('\n');
}

$('refresh').onclick = () => loadDiag().then(loadLog).catch(() => {});
$('logRefresh').onclick = () => loadLog().catch(() => {});
$('logApp').onclick = () => { logWhich = 'app'; $('logApp').classList.add('sel'); $('logCrash').classList.remove('sel'); loadLog(); };
$('logCrash').onclick = () => { logWhich = 'crash'; $('logCrash').classList.add('sel'); $('logApp').classList.remove('sel'); loadLog(); };

$('copy').onclick = async () => {
  if (!resLast) await loadRes().catch(() => {});
  const t = reportText();
  try { await navigator.clipboard.writeText(t); } catch {
    const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  }
  $('copy').textContent = '已复制';
  setTimeout(() => { $('copy').textContent = '复制报告'; }, 1200);
};

async function act(path, body, okText) {
  const r = await api(path, {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-local-token': localToken },
    body: JSON.stringify(body || {}),
  });
  $('actionInfo').textContent = r.status === 200 ? okText : '失败：HTTP ' + r.status + ' ' + (r.j?.error?.message || '');
  $('actionInfo').style.color = r.status === 200 ? 'var(--ok)' : 'var(--err)';
  setTimeout(() => loadDiag().catch(() => {}), 600);
}

$('clearCrash').onclick = () => act('/api/diag/clear-crash', {}, '崩溃记录已清空：下次启动会重新尝试 Vulkan');
$('ragRebuild').onclick = () => act('/api/rag/rebuild', {}, '文档索引已重建');
$('unload').onclick = () => act('/api/unload', {}, '模型已卸载，内存已释放');

loadDiag().then(loadLog).catch(() => {});
loadRes().catch(() => {});
setInterval(() => { if (document.visibilityState === 'visible') loadDiag().catch(() => {}); }, 5000);
setInterval(() => { if (document.visibilityState === 'visible') loadRes().catch(() => {}); }, 2000);
